  - "新建会话/刷新后的偏好保留"
  - "工具失败与空结果处理"
  - "上传图片/文件的多模态能力（页面有拍照搜题，但未测）"
  - "字数限制（≤50 字）是否遵守"
  - "中英切换的干净度"
  - "「普通模式」之外的另一种模式"
